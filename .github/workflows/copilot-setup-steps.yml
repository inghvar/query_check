name: "Copilot Code Review Setup Steps"

# This file only configures Copilot code review's own ephemeral environment.
# It is NOT triggered automatically for real reviews; the `on:` block below
# only exists so the job can be run/validated manually or on push, per
# GitHub's docs. Copilot invokes the `copilot-setup-steps` job itself when a
# review starts, regardless of these triggers.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch latest query-doctor-log artifact for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          echo "Looking up Query Doctor run for commit $SHA"

          # Query Doctor runs as its own workflow and may still be in
          # progress when this job starts. Poll with a bounded timeout
          # instead of checking once, so a slow producer isn't missed.
          MAX_WAIT_SECONDS=480
          POLL_INTERVAL_SECONDS=15
          ELAPSED=0
          RUN_ID=""

          while [ "$ELAPSED" -lt "$MAX_WAIT_SECONDS" ]; do
            RUN_ID="$(gh api "repos/$REPO/actions/workflows/query-doctor.yml/runs?head_sha=$SHA&status=completed" \
              --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN_ID" ]; then
              echo "Found completed Query Doctor run: $RUN_ID (after ${ELAPSED}s)"
              break
            fi
            echo "No completed Query Doctor run for $SHA yet (${ELAPSED}s elapsed); waiting ${POLL_INTERVAL_SECONDS}s..."
            sleep "$POLL_INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + POLL_INTERVAL_SECONDS))
          done

          if [ -z "$RUN_ID" ]; then
            echo "::warning::Timed out after ${MAX_WAIT_SECONDS}s waiting for a completed Query Doctor run for $SHA. query_doctor.log will NOT be available for this review."
            exit 0
          fi

          ARTIFACT_ID=""
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT_SECONDS" ]; do
            ARTIFACT_ID="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name=="query-doctor-log" and .expired==false) | .id' | head -n1)"
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Found artifact: $ARTIFACT_ID (after ${ELAPSED}s)"
              break
            fi
            echo "Run $RUN_ID completed but no query-doctor-log artifact yet (${ELAPSED}s elapsed); waiting ${POLL_INTERVAL_SECONDS}s..."
            sleep "$POLL_INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + POLL_INTERVAL_SECONDS))
          done

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::Timed out after ${MAX_WAIT_SECONDS}s waiting for the query-doctor-log artifact on run $RUN_ID. query_doctor.log will NOT be available for this review."
            exit 0
          fi

          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > query-doctor-log.zip
          unzip -o query-doctor-log.zip -d .
          rm -f query-doctor-log.zip

          echo "query_doctor.log is now present in the workspace for Copilot to read:"
          cat query_doctor.log || echo "(file not found after unzip)"
